name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit tests cover the pure helpers only; the ~94 MB models are not downloaded in CI.
      - run: pip install numpy pytest
      - run: python -m pytest -q
